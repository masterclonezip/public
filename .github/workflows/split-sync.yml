name: Dual Repo Split & Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: split-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  split-and-sync:
    if: "!endsWith(github.repository, '/admin') && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]'))"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Sync and Split Repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT: ${{ secrets.PAT || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.ADMIN_SYNC_TOKEN || secrets.SYNC_TOKEN || secrets.ADMIN_PAT || secrets.ACCESS_TOKEN || '' }}
          PUBLIC_REPO: ${{ secrets.GITHUB_PUBLIC_REPO || vars.GITHUB_PUBLIC_REPO || '' }}
          ADMIN_REPO: ${{ secrets.GITHUB_ADMIN_REPO || vars.GITHUB_ADMIN_REPO || '' }}
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name || github.actor || 'github-actions[bot]' }}
        run: |
          set -e
          # Clear any lingering GITHUB_TOKEN extraheader from actions/checkout
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "$AUTHOR_NAME"

          # List of files that should ONLY exist in Masterworld (Admin)
          ADMIN_ONLY_FILES=(
            "src/components/admin/"
            "src/pages/AdminDashboard.tsx"
            "src/pages/AdminLogin.tsx"
            "src/components/AdminLogin.tsx"
            "src/components/NewsTab.tsx"
            "src/components/SecurityTab.tsx"
            "src/components/FirebaseStatusPanel.tsx"
            "src/components/FirebaseStatusIndicator.tsx"
            "src/components/AppsTab.tsx"
            "src/components/ImageUpload.tsx"
            "src/hooks/useAdminAuth.ts"
            "src/hooks/useAdminApps.ts"
            "src/hooks/useAdminSettings.ts"
            "src/hooks/useAppForm.ts"
            "src/hooks/useAppFilters.ts"
            "src/hooks/useGitHubSync.ts"
            "src/hooks/useDataSync.ts"
            "src/hooks/useDataActions.ts"
            "src/contexts/DataContext.tsx"
            "src/services/adminAuthService.ts"
            "src/services/firestoreSyncService.ts"
            "src/services/dataService.ts"
            "src/server/routes/adminAuthRoutes.ts"
            "src/server/routes/adminVaultRoutes.ts"
            "src/server/routes/githubSyncRoutes.ts"
            "src/server/routes/uploadRoutes.ts"
            "src/server/services/geminiServerService.ts"
            "src/lib/githubSync.ts"
            "src/lib/appPdfExport.ts"
            "src/lib/totp.ts"
            "src/lib/secureStorage.ts"
            "src/lib/vaultNode.ts"
            "src/lib/sessionStore.ts"
            "src/lib/firebase.ts"
            "src/lib/adminCommunityFirebase.ts"
            ".aistudio/"
            "src/lib/secure_links_backup.json"
            "src/lib/autopilot_checkpoint.json"
            "src/server/secure_vault.json"
            "community_local_backup.json"
            "mock-2fa-state.json"
            "server.ts"
            "firestore.rules"
            "firebase.json"
            ".firebaserc"
            "bun.lock"
            "docs/"
            "scripts/verify-architecture.ts"
            "scripts/sync-firestore.ts"
            "scripts/update-vault-data.ts"
            "scripts/gen-vault.js"
            "scripts/count-apps.ts"
            "DATABASE_WORKFLOW.md"
            "ADMIN_TO_PUBLIC_SYNC_ARCHITECTURE.md"
            "FIREBASE_QUOTA_AND_COMMUNITY_ARCHITECTURE.md"
            "COMMUNITY_FIREBASE_README.md"
