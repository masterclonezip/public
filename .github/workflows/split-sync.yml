name: Dual Repo Split & Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: split-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  split-and-sync:
    if: "!endsWith(github.repository, '/admin') && !endsWith(github.repository, '-admin') && (github.event_name != 'push' || !contains(github.event.head_commit.message, 'Production Sync ('))"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Sync and Split Repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT: ${{ secrets.PAT || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.ADMIN_SYNC_TOKEN || secrets.SYNC_TOKEN || secrets.ADMIN_PAT || secrets.ACCESS_TOKEN || '' }}
          PUBLIC_REPO: ${{ secrets.GITHUB_PUBLIC_REPO || vars.GITHUB_PUBLIC_REPO || '' }}
          ADMIN_REPO: ${{ secrets.GITHUB_ADMIN_REPO || vars.GITHUB_ADMIN_REPO || '' }}
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name || github.actor || 'github-actions[bot]' }}
        run: |
          set -e
          # Clear any lingering GITHUB_TOKEN extraheader from actions/checkout
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "$AUTHOR_NAME"

          # List of files that should ONLY exist in Masterworld (Admin)
          ADMIN_ONLY_FILES=(
            "src/components/admin/"
            "src/pages/AdminDashboard.tsx"
            "src/pages/AdminLogin.tsx"
            "src/components/AdminLogin.tsx"
            "src/components/NewsTab.tsx"
            "src/components/SecurityTab.tsx"
            "src/components/FirebaseStatusPanel.tsx"
            "src/components/FirebaseStatusIndicator.tsx"
            "src/components/AppsTab.tsx"
            "src/components/ImageUpload.tsx"
            "src/hooks/useAdminAuth.ts"
            "src/hooks/useAdminApps.ts"
            "src/hooks/useAdminSettings.ts"
            "src/hooks/useAppForm.ts"
            "src/hooks/useAppFilters.ts"
            "src/hooks/useGitHubSync.ts"
            "src/hooks/useDataSync.ts"
            "src/hooks/useDataActions.ts"
            "src/contexts/DataContext.tsx"
            "src/services/adminAuthService.ts"
            "src/services/firestoreSyncService.ts"
            "src/services/dataService.ts"
            "src/services/localCacheService.ts"
            "src/server/routes/adminAuthRoutes.ts"
            "src/server/routes/adminVaultRoutes.ts"
            "src/server/routes/githubSyncRoutes.ts"
            "src/server/routes/uploadRoutes.ts"
            "src/server/services/geminiServerService.ts"
            "src/lib/githubSync.ts"
            "src/lib/appPdfExport.ts"
            "src/lib/totp.ts"
            "src/lib/secureStorage.ts"
            "src/lib/vaultNode.ts"
            "src/lib/sessionStore.ts"
            "src/lib/firebase.ts"
            "src/lib/adminCommunityFirebase.ts"
            "src/lib/aiStudioBrain.json"
            "src/lib/dummyAdmin.ts"
            ".aistudio/"
            "public/assets/"
            "src/lib/secure_links_backup.json"
            "src/lib/autopilot_checkpoint.json"
            "src/server/secure_vault.json"
            "community_local_backup.json"
            "mock-2fa-state.json"
            "server.ts"
            "firestore.rules"
            "firebase.json"
            ".firebaserc"
            "bun.lock"
            "docs/"
            "scripts/verify-architecture.ts"
            "scripts/sync-firestore.ts"
            "scripts/update-vault-data.ts"
            "scripts/gen-vault.js"
            "scripts/count-apps.ts"
            "DATABASE_WORKFLOW.md"
            "ADMIN_TO_PUBLIC_SYNC_ARCHITECTURE.md"
            "FIREBASE_QUOTA_AND_COMMUNITY_ARCHITECTURE.md"
            "COMMUNITY_FIREBASE_README.md"
            "AI_PITFALLS.md"
            "DUAL_DATABASE_RATING_SYSTEM.md"
            "MORE_INFO_SECURITY_ARCHITECTURE.md"
            "ENV_VARS_GUIDE.md"
            "MASTER_WHITE_LABEL_BLUEPRINT.md"
            "SEO_ARCHITECTURE.md"
            "SEO_MAP.md"
            "AI_SEO_CHEAT_SHEET.md"
            "metadata.json"
            "src/lib/public_backup.json"
          )

          # List of files that should ONLY exist in Dex (Public)
          PUBLIC_ONLY_FILES=(
            "public-api/"
            "public/assets/"
            "public/data/"
            "public/ai-catalog.json"
            "public/llms.txt"
            "src/components/public/"
            "src/pages/About.tsx"
            "src/pages/AppDetails.tsx"
            "src/pages/Contact.tsx"
            "src/pages/Developers.tsx"
            "src/pages/Disclaimer.tsx"
            "src/pages/Ethics.tsx"
            "src/pages/FaqPage.tsx"
            "src/pages/GatewayPage.tsx"
            "src/pages/Home.tsx"
            "src/pages/NewsDetailPage.tsx"
            "src/pages/NewsPage.tsx"
            "src/pages/Notice.tsx"
            "src/pages/Privacy.tsx"
            "src/pages/ReportRemoval.tsx"
            "src/pages/Responsibility.tsx"
            "src/pages/SafetyStatus.tsx"
            "src/pages/Terms.tsx"
            "src/pages/VideoDetailPage.tsx"
            "src/pages/VideosPage.tsx"
            "src/components/AccordionItem.tsx"
            "src/components/FallbackRouteMatcher.tsx"
            "src/components/LanguageSelector.tsx"
            "src/components/MobileMenuModal.tsx"
            "src/components/PlayStoreRatingSection.tsx"
            "src/components/PlayStoreUI.tsx"
            "src/components/playstore/"
            "src/components/ReportAppModal.tsx"
            "src/components/LightSearch.tsx"
            "src/components/NeutralSyncButton.tsx"
            "src/components/SupportWidget.tsx"
            "src/components/Ticker.tsx"
            "src/components/UserReviews.tsx"
            "src/components/WebsiteTitleHero.tsx"
            "src/lib/routePreloader.ts"
            "src/lib/pageComponents.ts"
          )

          SOURCE_DIR=$(pwd)
          PARENT_DIR=$(dirname "$SOURCE_DIR")

          # Auto-detect target repositories if not explicitly provided
          ADMIN_TARGET="${ADMIN_REPO:-${GITHUB_REPOSITORY_OWNER}/admin}"
          PUBLIC_TARGET="${PUBLIC_REPO:-${GITHUB_REPOSITORY}}"

          if [ "$GITHUB_REPOSITORY" = "$ADMIN_TARGET" ]; then
            echo "Notice: Current repository ($GITHUB_REPOSITORY) is already the Admin target. Skipping split-sync."
            exit 0
          fi

          echo "=========================================================="
          echo "🔄 Dual-Repo Split-Sync Engine Active"
          echo "Source Repository: $GITHUB_REPOSITORY"
          echo "Target Public:     $PUBLIC_TARGET"
          echo "Target Admin:      $ADMIN_TARGET"
          echo "Commit Message:    $COMMIT_MSG"
          echo "=========================================================="

          CLEAN_PAT=$(echo -n "$PAT" | tr -d '[:space:]')
          if [ -z "$CLEAN_PAT" ]; then
            echo "⚠️ WARNING: 'PAT' (Personal Access Token) secret not found in repository secrets."
            echo "GitHub Actions built-in token cannot push cross-repository to '$ADMIN_TARGET'."
            echo "Skipping cross-repo push until PAT is added."
            exit 0
          fi

          sync_repo() {
            REPO_NAME=$1
            REPO_URL=$2
            TYPE=$3 # "public" or "admin"

            echo ""
            echo "--- Preparing $REPO_NAME sync to $REPO_URL ($TYPE) ---"
            cd "$PARENT_DIR"
            rm -rf "${REPO_NAME}_repo"
            
            # Common excludes - strictly prevent secrets, backups, and debug screenshots from leaking anywhere
            RSYNC_EXCLUDES="--exclude=.git --exclude=.github --exclude=node_modules --exclude=dist --exclude=public/assets --exclude=public/assets/aistudio --exclude=*.tmp --exclude=*.log --exclude=api_temp.ts --exclude=mock-2fa-state.json --exclude=autopilot_checkpoint.json* --exclude=community_local_backup.json* --exclude=src/lib/public_backup.json* --exclude=src/lib/secure_links_backup.json* --exclude=.env* --exclude=bun.lock* --exclude=bun.lockb --exclude=yarn.lock --exclude=pnpm-lock.yaml"

            if [ -z "$REPO_URL" ]; then
              echo "Skipping $REPO_NAME sync: repository target not configured."
              return 0
            fi

            # Determine target branch
            # If public target is the source repository itself (AI Studio connected repo), push to 'production' branch to protect AI Studio main branch
            TARGET_BRANCH="main"
            if [ "$TYPE" = "public" ] && [ "$REPO_URL" = "$GITHUB_REPOSITORY" ]; then
              TARGET_BRANCH="production"
              echo "Notice: Public target matches current AI Studio source ($GITHUB_REPOSITORY)."
              echo "Pushing stripped public release to branch '$TARGET_BRANCH' so 'main' is preserved for AI Studio sync."
            fi

            # For the current repository (public), use native GITHUB_TOKEN which has write permissions.
            # For cross-repository target (admin), use the personal access token.
            if [ "$REPO_URL" = "$GITHUB_REPOSITORY" ]; then
              AUTH_REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO_URL}.git"
              PUSH_AUTH_FALLBACK=""
            else
              AUTH_REPO_URL="https://${CLEAN_PAT}@github.com/${REPO_URL}.git"
              PUSH_AUTH_FALLBACK="https://x-access-token:${CLEAN_PAT}@github.com/${REPO_URL}.git"
            fi

            if git clone "$AUTH_REPO_URL" "${REPO_NAME}_repo"; then
              cd "${REPO_NAME}_repo"
              git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
              git checkout -B "$TARGET_BRANCH" 2>/dev/null || true

              # If syncing to public repo and source staticData.json has an empty apps array, preserve target repo's existing synced catalog, sitemaps & vault
              mkdir -p /tmp/public_catalog_preserve/sitemaps
              rm -rf /tmp/public_catalog_preserve/*
              mkdir -p /tmp/public_catalog_preserve/sitemaps
              if [ "$TYPE" = "public" ] && [ -f "src/lib/staticData.json" ]; then
                if grep -q '"apps":\s*\[\s*\]' "$SOURCE_DIR/src/lib/staticData.json" 2>/dev/null && ! grep -q '"apps":\s*\[\s*\]' "src/lib/staticData.json" 2>/dev/null; then
                  echo "Preserving populated public catalog data and sitemaps from target public repo..."
                  cp -f src/lib/staticData.json /tmp/public_catalog_preserve/staticData.json 2>/dev/null || true
                  cp -f src/lib/staticData.ts /tmp/public_catalog_preserve/staticData.ts 2>/dev/null || true
                  cp -f src/lib/secureVault.ts /tmp/public_catalog_preserve/secureVault.ts 2>/dev/null || true
                  cp -f src/lib/communityCatalogStats.json /tmp/public_catalog_preserve/communityCatalogStats.json 2>/dev/null || true
                  cp -f src/lib/communityStaticReviews.json /tmp/public_catalog_preserve/communityStaticReviews.json 2>/dev/null || true
                  cp -f public/sitemap*.xml* /tmp/public_catalog_preserve/sitemaps/ 2>/dev/null || true
                  cp -f public/robots.txt /tmp/public_catalog_preserve/sitemaps/robots.txt 2>/dev/null || true
                  cp -f public/site.webmanifest /tmp/public_catalog_preserve/sitemaps/site.webmanifest 2>/dev/null || true
                  cp -f public/opensearch.xml /tmp/public_catalog_preserve/sitemaps/opensearch.xml 2>/dev/null || true
                fi
              fi

              # Mirror workspace files
              rsync -rv $RSYNC_EXCLUDES --delete "$SOURCE_DIR/" .

              if [ "$TYPE" = "public" ] && [ -f "/tmp/public_catalog_preserve/staticData.json" ]; then
                cp -f /tmp/public_catalog_preserve/staticData.json src/lib/staticData.json 2>/dev/null || true
                [ -f "/tmp/public_catalog_preserve/staticData.ts" ] && cp -f /tmp/public_catalog_preserve/staticData.ts src/lib/staticData.ts 2>/dev/null || true
                [ -f "/tmp/public_catalog_preserve/secureVault.ts" ] && cp -f /tmp/public_catalog_preserve/secureVault.ts src/lib/secureVault.ts 2>/dev/null || true
                [ -f "/tmp/public_catalog_preserve/communityCatalogStats.json" ] && cp -f /tmp/public_catalog_preserve/communityCatalogStats.json src/lib/communityCatalogStats.json 2>/dev/null || true
                [ -f "/tmp/public_catalog_preserve/communityStaticReviews.json" ] && cp -f /tmp/public_catalog_preserve/communityStaticReviews.json src/lib/communityStaticReviews.json 2>/dev/null || true
                cp -f /tmp/public_catalog_preserve/sitemaps/* public/ 2>/dev/null || true
              fi

              # Always strip any stale/deleted turnstile_site_key or turnstile_secret_key from staticData.json and staticData.ts in public repo
              if [ "$TYPE" = "public" ]; then
                node -e '
                  const fs = require("fs");
                  for (const p of ["src/lib/staticData.json", "public-api/staticData.json"]) {
                    if (fs.existsSync(p)) {
                      try {
                        const j = JSON.parse(fs.readFileSync(p, "utf8"));
                        if (j && j.settings) {
                          delete j.settings.turnstile_site_key;
                          delete j.settings.turnstile_secret_key;
                          fs.writeFileSync(p, JSON.stringify(j), "utf8");
                        }
                      } catch {}
                    }
                  }
                  if (fs.existsSync("src/lib/staticData.ts")) {
                    try {
                      let s = fs.readFileSync("src/lib/staticData.ts", "utf8");
                      s = s.replace(/"turnstile_site_key"\s*:\s*"[^"]*"\s*,?/g, "");
                      s = s.replace(/"turnstile_secret_key"\s*:\s*"[^"]*"\s*,?/g, "");
                      fs.writeFileSync("src/lib/staticData.ts", s, "utf8");
                    } catch {}
                  }
                ' 2>/dev/null || true
              fi
            else
              mkdir -p "${REPO_NAME}_repo"
              cd "${REPO_NAME}_repo"
              git init
              git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
              git remote add origin "$AUTH_REPO_URL" 2>/dev/null || git remote set-url origin "$AUTH_REPO_URL"
              git checkout -B "$TARGET_BRANCH"
              rsync -rv $RSYNC_EXCLUDES "$SOURCE_DIR/" .
            fi
            
            # Explicitly purge any rogue lockfiles and screenshot directories
            rm -f bun.lock bun.lockb yarn.lock pnpm-lock.yaml
            rm -rf public/assets
            
            # Ensure .npmrc is always present
            if [ -f "$SOURCE_DIR/.npmrc" ]; then
              cp "$SOURCE_DIR/.npmrc" .npmrc
            fi
            
            # Explicitly remove .github to prevent workflow nesting/looping in target repositories
            rm -rf .github
            git rm -rf --ignore-unmatch .github 2>/dev/null || true

            if [ "$TYPE" = "public" ]; then
              echo "Enforcing Public-Only Dex Isolation..."
              if [ -f "$SOURCE_DIR/vercel.json" ]; then
                cp "$SOURCE_DIR/vercel.json" vercel.json
              fi
              
              # Build the public-only API from the latest source BEFORE stripping server files
              echo "Building clean public API..."
              (cd "$SOURCE_DIR" && node scripts/build-api.js || echo "API build failed")
              mkdir -p public-api
              if [ -f "$SOURCE_DIR/api/index.js" ]; then
                cp "$SOURCE_DIR/api/index.js" public-api/index.js
              fi

              for file in "${ADMIN_ONLY_FILES[@]}"; do
                rm -rf "$file"
              done
              
              # Force remove old files to prevent Vercel conflicts
              rm -f api/index.ts
              rm -f api/index.js

              # Restore prerender and compress scripts for Vercel / Cloudflare Pages
              mkdir -p scripts
              if [ -f "$SOURCE_DIR/scripts/prerender.ts" ]; then
                cp "$SOURCE_DIR/scripts/prerender.ts" scripts/prerender.ts
              fi
              if [ -f "$SOURCE_DIR/scripts/compress-dist.ts" ]; then
                cp "$SOURCE_DIR/scripts/compress-dist.ts" scripts/compress-dist.ts
              fi
              
              # Strip any residual maintenance, test, or config files from root
              find . -maxdepth 1 -name "*.js" ! -name "eslint.config.mjs" ! -name "eslint.config.cjs" ! -name "postcss.config.js" ! -name "tailwind.config.js" -exec rm -f {} +
              find . -maxdepth 1 -name "*.ts" ! -name "vite.config.ts" -exec rm -f {} +
              find . -maxdepth 1 -name "*.sh" -exec rm -f {} +
              find . -maxdepth 1 -name "*.patch" -exec rm -f {} +
              find . -maxdepth 1 -name "*.html" ! -name "index.html" -exec rm -f {} +
              find . -maxdepth 1 -name "*.md" ! -name "README.md" -exec rm -f {} +

              rm -rf api/
              mkdir -p api
              if [ -f "public-api/index.js" ]; then
                mv public-api/index.js api/index.js
                rm -rf public-api
              elif [ -f "public-api/index.ts" ]; then
                mv public-api/index.ts api/index.ts
                rm -rf public-api
              fi
              if [ -f "src/AppPublic.tsx" ]; then
                cp -f src/AppPublic.tsx src/App.tsx
                rm -f src/AppPublic.tsx src/AppAdmin.tsx
              fi
              if [ -f "vite.config.ts" ]; then
                sed -i 's/__ADMIN_ENABLED__:.*/__ADMIN_ENABLED__: false,/g' vite.config.ts 2>/dev/null || true
              fi
              rm -f strip-admin-from-dex.js
              rm -f strip-public-from-masterworld.js
              rm -f src/sync-meta.json
            fi

            if [ "$TYPE" = "admin" ]; then
              echo "Enforcing Admin-Only Masterworld Isolation (100% Firebase-Driven, Zero Public Static Data)..."
              # 1. Strip all explicit public-only files
              for file in "${PUBLIC_ONLY_FILES[@]}"; do
                rm -rf "$file"
              done
              
              # Force remove api/index.ts and public sitemaps (Admin does not serve public sitemaps or static catalog)
              rm -f api/index.ts
              rm -f public/sitemap*.xml public/sitemap*.xml.gz
              rm -f src/sync-meta.json
              
              # Reset static data files in Admin to fixed empty shells so Public content updates NEVER trigger Admin commits or builds
              echo '{"apps":[],"settings":{},"news":[],"videos":[],"reviews":[]}' > src/lib/staticData.json
              printf "%s\n" \
                "import { AppConfig, GlobalSettings, NewsItem, VideoItem } from '../types';" \
                "export const mockApps: AppConfig[] = [];" \
                "export const mockSettings: GlobalSettings = {} as GlobalSettings;" \
                "export const mockNews: NewsItem[] = [];" \
                "export const mockVideos: VideoItem[] = [];" \
                "export const mockReviews: any[] = [];" \
                > src/lib/staticData.ts
              echo '{"appCounts":{},"totalReviews":0}' > src/lib/communityCatalogStats.json
              echo '{}' > src/lib/communityStaticReviews.json
              
              # 2. Strict Allowlist enforcement for pages
              echo "Purging non-admin pages..."
              find src/pages -type f ! -name "AdminDashboard.tsx" ! -name "AdminLogin.tsx" -delete
              # 3. Swap App to Admin
              if [ -f "src/AppAdmin.tsx" ]; then
                cp -f src/AppAdmin.tsx src/App.tsx
                rm -f src/AppAdmin.tsx src/AppPublic.tsx
              fi
              rm -f strip-public-from-masterworld.js
              rm -f strip-admin-from-dex.js
            fi

            # Ensure public/_redirects has no invalid /* /index.html 200 loop rule on Cloudflare Pages
            if [ "$TYPE" = "admin" ]; then
              rm -f public/_redirects
            fi

            git add -A
            if [ -n "$(git status --porcelain)" ]; then
              # IMPORTANT: Do NOT include [skip ci] in the commit message because Cloudflare Pages skips builds when [skip ci] is present!
              git commit -m "Production Sync ($TYPE) [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"

              # Re-ensure origin URL with token and clear any conflicting local extraheader
              git remote set-url origin "$AUTH_REPO_URL" 2>/dev/null || true
              git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true

              PUSH_SUCCESS=false
              AUTH_URLS=(
                "https://${CLEAN_PAT}@github.com/${REPO_URL}.git"
                "https://${GITHUB_ACTOR}:${CLEAN_PAT}@github.com/${REPO_URL}.git"
                "https://x-access-token:${CLEAN_PAT}@github.com/${REPO_URL}.git"
                "https://oauth2:${CLEAN_PAT}@github.com/${REPO_URL}.git"
              )

              if [ "$REPO_URL" = "$GITHUB_REPOSITORY" ]; then
                AUTH_URLS=("https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO_URL}.git")
              fi

              for auth_url in "${AUTH_URLS[@]}"; do
                git remote set-url origin "$auth_url" 2>/dev/null || true
                if git push -u origin "$TARGET_BRANCH"; then
                  PUSH_SUCCESS=true
                  break
                elif git push -u origin "$TARGET_BRANCH" --force; then
                  PUSH_SUCCESS=true
                  break
                fi
              done

              if [ "$PUSH_SUCCESS" = "true" ]; then
                echo "✅ Successfully synced to $REPO_URL ($TARGET_BRANCH)!"
              else
                echo "::error title=Sync Failed for $REPO_NAME::Failed to push to $REPO_URL ($TARGET_BRANCH)."
                return 1
              fi
            else
              echo "No changes detected for $REPO_NAME ($TARGET_BRANCH). Skipping unnecessary commit & deployment."
            fi
          }

          # 1. Transfer Admin codebase to target Admin repository (git status --porcelain inside sync_repo automatically skips if no Admin files changed)
          sync_repo "admin" "$ADMIN_TARGET" "admin" || ADMIN_SYNC_FAILED=1

          # 2. Sync clean Public release (if separate public repo configured or to production branch)
          sync_repo "public" "$PUBLIC_TARGET" "public" || PUBLIC_SYNC_FAILED=1

          if [ "${ADMIN_SYNC_FAILED:-0}" = "1" ] || [ "${PUBLIC_SYNC_FAILED:-0}" = "1" ]; then
            echo "::error::One or more sync targets failed. Check diagnostics above."
            exit 1
          fi

